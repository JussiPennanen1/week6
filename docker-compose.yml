version: "3.9"
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: placeholder_root_password
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
  
  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: placeholder_password
      DB_NAME: appdb
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"